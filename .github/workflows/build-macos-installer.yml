name: Build macOS Installer

on:
  push:
    branches: [main, master]
    paths:
      - "OpenClaw Installer.app/**"
      - "scripts/**"
      - "build-dmg.sh"
      - "prepare-on-mac.sh"
      - "一键安装-OpenClaw.command"
      - "使用说明.txt"
      - ".github/workflows/build-macos-installer.yml"
  pull_request:
    paths:
      - "OpenClaw Installer.app/**"
      - "scripts/**"
      - "build-dmg.sh"
      - "prepare-on-mac.sh"
      - "一键安装-OpenClaw.command"
      - "使用说明.txt"
      - ".github/workflows/build-macos-installer.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (e.g. 1.0.1)"
        required: false
        default: "1.0.0"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build DMG on macOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            V="${{ github.event.release.tag_name }}"
            V="${V#v}"
          else
            V="1.0.0"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building installer version: ${V}"

      - name: Prepare permissions
        run: |
          bash prepare-on-mac.sh
          chmod +x build-dmg.sh

      - name: Build DMG + ZIP
        env:
          OPENCLAW_INSTALLER_VERSION: ${{ steps.ver.outputs.version }}
        run: ./build-dmg.sh

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Installer-macOS-${{ steps.ver.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.dmg dist/*.zip \
            --clobber
